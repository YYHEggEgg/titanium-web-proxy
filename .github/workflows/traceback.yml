name: Traceback core maintenance
on:
  push:
    branches: [codex/traceback]
  pull_request:
    branches: [codex/traceback]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TITANIUM_SKIP_ROOT_STORE_UI: '1'
      TITANIUM_NO_ELEVATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Standalone core regressions
        run: dotnet test tests/Titanium.Web.Proxy.TracebackTests/Titanium.Web.Proxy.TracebackTests.csproj -c Release --logger trx --results-directory TestResults/core
      - name: Selected upstream core unit tests without store fixtures
        if: runner.os == 'Windows'
        run: dotnet test tests/Titanium.Web.Proxy.UnitTests/Titanium.Web.Proxy.UnitTests.csproj -c Release -p:IsTestHost=false --filter "FullyQualifiedName~ProxyListenExceptionTests|FullyQualifiedName~Http2HelperStartupAndNullOriginTests" --logger trx --results-directory TestResults/unit
      - name: Selected upstream HTTP2 wire tests without store fixtures
        if: runner.os == 'Windows'
        run: dotnet test tests/Titanium.Web.Proxy.IntegrationTests/Titanium.Web.Proxy.IntegrationTests.csproj -c Release -p:IsTestHost=false --filter "FullyQualifiedName~Http2ContinuationAndAbuseBudgetTests" --logger trx --results-directory TestResults/settings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: traceback-tests-${{ matrix.os }}
          path: TestResults
